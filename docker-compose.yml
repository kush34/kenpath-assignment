services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - sweety_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sweety}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: sweety:local
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sweety}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Compose}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_URL: redis://cache:6379
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-5174}
    ports:
      - "${API_PORT:-4001}:4000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  client:
    image: sweety:local
    command: ["npm", "run", "dev:client", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://app:4000
    ports:
      - "${CLIENT_PORT:-5174}:5173"
    depends_on:
      app:
        condition: service_started

  worker:
    image: sweety:local
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sweety}
      REDIS_URL: redis://cache:6379
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  sweety_data:
